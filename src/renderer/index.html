<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' app: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title>الموسوعة الإباضية</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="titlebar" id="titlebar">
        <div class="tb-brand" id="brand"></div>
        <nav class="tb-sections" id="sections" aria-label="الأقسام"></nav>
        <div class="tb-tabs" id="tabs" role="tablist" aria-label="الكتب المفتوحة"></div>
        <div class="tb-tools" id="tools"></div>
        <div class="win-controls" id="win-controls"></div>
      </header>
      <main class="views" id="views"></main>
    </div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
