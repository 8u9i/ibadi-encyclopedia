<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' app: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title>الموسوعة الإباضية</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <nav class="rail" id="rail" aria-label="الأقسام"></nav>
      <div class="main">
        <header class="topbar">
          <div class="tabs" id="tabs" role="tablist"></div>
          <button class="quick-open" id="quick-open" title="بحث سريع عن كتاب أو مؤلف (Ctrl+K)">
            <span class="ico" data-icon="search"></span><span>ابحث عن كتاب أو مؤلف…</span><kbd>Ctrl K</kbd>
          </button>
        </header>
        <div class="views" id="views"></div>
      </div>
    </div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
